<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1f4e79">
  <title>Planisphère – jeu de géographie</title>
  <meta name="description" content="Apprendre où sont les pays du monde et leurs capitales, et les départements français avec leurs numéros et préfectures.">
  <!-- Installation sur l'écran d'accueil (Android, ordinateur, iPhone) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planisphère">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="barre">
      <button id="btn-accueil" class="bouton-icone" aria-label="Retour à l'accueil" title="Accueil">⌂</button>
      <h1 id="titre">Planisphère</h1>
      <div id="choix-projection" class="interrupteur" role="group" aria-label="Type de carte"></div>
    </header>

    <main id="zone-carte">
      <div class="boutons-zoom" role="group" aria-label="Zoom">
        <button class="bouton-icone" data-zoom="plus" aria-label="Zoomer" title="Zoomer">+</button>
        <button class="bouton-icone" data-zoom="moins" aria-label="Dézoomer" title="Dézoomer">−</button>
        <button class="bouton-icone" data-zoom="tout" aria-label="Voir toute la carte" title="Voir toute la carte">⟲</button>
      </div>
      <div id="bulle" class="bulle" hidden></div>
      <!-- Visible tant que le jeu n'a pas démarré : utile quand la page est ouverte dans un aperçu de fichier sans JavaScript -->
      <div id="message-chargement" class="message-chargement">
        <p><strong>Chargement de la carte…</strong></p>
        <p>Si ce message reste affiché, la page a été ouverte dans un simple aperçu de fichier
          (c'est fréquent sur téléphone), qui ne sait pas faire fonctionner le jeu.
          Ouvrez plutôt le lien internet du jeu, ou ouvrez le fichier sur un ordinateur.</p>
      </div>
    </main>

    <section id="panneau" class="panneau" aria-live="polite"></section>
  </div>

  <!-- Bibliothèques (copiées dans le projet, aucun chargement depuis internet) -->
  <script src="js/lib/d3.min.js"></script>
  <script src="js/lib/topojson-client.min.js"></script>
  <!-- Moteur du jeu (indépendant des données) -->
  <script src="js/moteur/espace.js"></script>
  <script src="js/moteur/carte.js"></script>
  <script src="js/moteur/reponses.js"></script>
  <script src="js/moteur/modes.js"></script>
  <script src="js/moteur/progression.js"></script>
  <script src="js/moteur/profils.js"></script>  <!-- Liste des jeux de données (chacun est chargé quand on le choisit) -->
  <script src="donnees/catalogue.js"></script>
  <!-- Écrans -->
  <script src="js/app.js"></script>
</body>
</html>
